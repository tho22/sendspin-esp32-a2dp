# Sendspin -> ESP32-WROVER -> Bluetooth (A2DP) -> Sony SRS-XB100
#
# First pairing: put the speaker into pairing mode (hold the power/pairing button), then start the ESP.
# Afterwards it reconnects automatically.

substitutions:
  name: sendspin-bt-1
  friendly_name: Sendspin BT 1
  # Speaker to discover by name; alternatively set "address" below to skip the discovery
  bt_device_name: "SRS-XB100"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp-wrover-kit
  variant: esp32
  framework:
    type: esp-idf
    # WiFi compromise from the A/B runs of the native variant (see docs/TEST_REPORT.md): receive aggregation in
    # short bursts plus small buffers. Without aggregation or with the default lwIP mailbox (6) the TCP stream backs
    # up and Sendspin's clock sync breaks (silence only); with Sendspin's high performance defaults (BA 32, 16/64,
    # 64 KB) long WiFi bursts disturb A2DP (dropouts).
    sdkconfig_options:
      CONFIG_ESP_WIFI_AMPDU_TX_ENABLED: n
      CONFIG_ESP_WIFI_AMPDU_RX_ENABLED: y
      CONFIG_ESP_WIFI_RX_BA_WIN: "6"
      CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM: "12"
      CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM: "40"
      CONFIG_LWIP_TCP_WND_DEFAULT: "16384"  # TEST, was 32768
      CONFIG_LWIP_TCP_SND_BUF_DEFAULT: "8192"
      CONFIG_LWIP_TCP_RECVMBOX_SIZE: "64"
      CONFIG_LWIP_TCPIP_RECVMBOX_SIZE: "64"
      # Keep out-of-order TCP segments (ESPHome limits them to 4, the IDF default is unlimited): with a 32 KB window a
      # single lost frame otherwise discards everything behind it, and the retransmissions stalled the stream for
      # seconds while the native variant played cleanly in the same environment
      CONFIG_LWIP_TCP_OOSEQ_MAX_PBUFS: "0"
      # Like the native variant: malloc() above 4 KB may use PSRAM (32 KB internal kept in reserve). With
      # ESPHome's default (PSRAM only via heap_caps) Sendspin's incoming chunks exhausted the internal RAM once
      # Music Assistant filled the 1 MB buffer (abort in operator new)
      CONFIG_SPIRAM_USE_CAPS_ALLOC: n
      CONFIG_SPIRAM_USE_MALLOC: y
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "4096"
      CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL: "32768"
      # Keep core 0 for WiFi + Bluetooth (like squeezelite-esp32): ESPHome main loop and Sendspin threads
      # (receive, FLAC decoder) on core 1
      CONFIG_ESP_MAIN_TASK_AFFINITY_CPU0: n
      CONFIG_ESP_MAIN_TASK_AFFINITY_CPU1: y
      CONFIG_PTHREAD_DEFAULT_CORE_NO_AFFINITY: n
      CONFIG_PTHREAD_DEFAULT_CORE_1: y
      # TCP/IP stack on core 1 as well (network traffic off the radio core)
      CONFIG_LWIP_TCPIP_TASK_AFFINITY_NO_AFFINITY: n
      CONFIG_LWIP_TCPIP_TASK_AFFINITY_CPU1: y
      # Diagnostics: CPU load per task in the "Load:" log line
      CONFIG_FREERTOS_USE_TRACE_FACILITY: y
      CONFIG_FREERTOS_GENERATE_RUN_TIME_STATS: y
      CONFIG_FREERTOS_VTASKLIST_INCLUDE_COREID: y

psram:
  mode: quad
  speed: 40MHz

logger:
  # DEBUG is compiled in, but only INFO is active after boot: every log line costs CPU, and the web interface
  # streams it to each open page. Enable DEBUG explicitly with "Log level" (back to INFO after 10 min or a reboot).
  level: DEBUG
  initial_level: INFO

api:
  encryption:
    key: !secret api_encryption_key
  # Do not reboot when no Home Assistant is connected (default: every 15 min without an API client)
  reboot_timeout: 0s

ota:
  - platform: esphome
    # Secured with the API key instead of a separate password (saves ~3.5 KB flash)
    encryption:
      key: !secret api_encryption_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Modem sleep outside streaming; while streaming Sendspin turns it off for an accurate clock sync
  # ("high performance")
  power_save_mode: light
  # No background scans for a better access point: a scan takes the shared radio off the channel
  post_connect_roaming: false

external_components:
  - source:
      type: local
      path: components
    # pn7160, pn7160_i2c: copies of ESPHome's components, extended to detect ISO 15693 tags (e.g. Tonies) by UID and
    # fixed to stay in step with the NFCC's responses when a tag is read (see README)
    components: [a2dp_source, pn7160, pn7160_i2c]

# NFC reader (PN7160 via I2C): scanned tags are reported to Home Assistant as tag scans
i2c:
  sda: GPIO21
  scl: GPIO22
  # Shorter bus transactions than ESPHome's default of 50 kHz: the PN7160 polling runs in the main loop
  frequency: 400kHz

pn7160_i2c:
  # IRQ is an input-only pin, which is fine: the PN7160 drives the line
  irq_pin: GPIO34
  ven_pin: GPIO25
  # A tag counts as removed after this long unseen. With the default of 250 ms a tag left on the reader was reported
  # as removed and placed again, and Home Assistant got a tag scan each time. With this reader most activations of a
  # tag fail (~87 %), so a tag lying still can stay unseen for a few seconds; 2 s still let it drop out
  tag_ttl: 5s
  on_tag:
    - text_sensor.template.publish:
        id: nfc_tag
        state: !lambda |-
          // Tags written by the HA Companion app carry the tag ID as NDEF URL
          static const std::string prefix = "home-assistant.io/tag/";
          if (tag.has_ndef_message()) {
            for (auto &record : tag.get_ndef_message()->get_records()) {
              std::string payload = record->get_payload();
              size_t pos = payload.find(prefix);
              if (pos != std::string::npos)
                return payload.substr(pos + prefix.size());
            }
          }
          // Other tags (e.g. Tonies, ISO 15693): the UID, shows up in HA as a new tag
          return x;
    - homeassistant.tag_scanned: !lambda return id(nfc_tag).state;
  on_tag_removed:
    - text_sensor.template.publish:
        id: nfc_tag
        state: No tag

speaker:
  - platform: a2dp_source
    id: bt_speaker
    device_name: ${bt_device_name}
    # address: "AA:BB:CC:DD:EE:FF"
    local_name: ${friendly_name}
    # Lives in internal RAM (fast access from the Bluetooth task), so keep it small
    buffer_duration: 200ms
    reconnect_interval: 15s
    # Speaker buttons (AVRCP) go to Music Assistant as Sendspin commands (works without an active stream)
    on_play_pause:
      - script.execute: play_pause
    on_next:
      - lambda: id(sendspin_hub).send_client_command(sendspin::SendspinControllerCommand::NEXT);
    on_previous:
      - lambda: id(sendspin_hub).send_client_command(sendspin::SendspinControllerCommand::PREVIOUS);
    on_stop:
      - lambda: id(sendspin_hub).send_client_command(sendspin::SendspinControllerCommand::STOP);
    # Volume changed on the speaker (absolute volume): update the media player and thereby Music Assistant
    on_volume:
      - media_player.volume_set:
          id: media_player_bt
          volume: !lambda return x;

sendspin:
  id: sendspin_hub
  # No task stacks in PSRAM: on ESP32 rev1 this crashes in Sendspin's ring buffer
  task_stack_in_psram: false

media_source:
  - platform: sendspin
    id: sendspin_source
    # A2DP (SBC) runs at a fixed 44.1 kHz -> no Opus (48 kHz only), no resampling needed
    sample_rate: 44100
    codecs: [flac, pcm]
    # Encoded audio buffer (PSRAM). Music Assistant fills it ahead of time; with 150 KB dense music (FLAC
    # ~1 Mbit/s) overflowed it: dropped chunks, each a 104.5 ms gap. 1 MB is ESPHome's default.
    buffer_size: 1000000
    # Internal RAM: PSRAM of ESP32 rev1 is slow (cache workaround)
    decode_memory: internal
    # Compensates the speaker's Bluetooth latency (the XB100 reports 250 ms); adjustable in Music Assistant
    initial_static_delay: 250ms
    static_delay_adjustable: true

media_player:
  - platform: speaker_source
    id: media_player_bt
    name: Player
    # Volume after a fresh flash (afterwards the last volume is restored); low, so a new setup does not blast
    volume_initial: 10%
    media_pipeline:
      speaker: bt_speaker
      sources:
        - sendspin_source

binary_sensor:
  - platform: template
    name: Bluetooth connected
    entity_category: diagnostic
    lambda: return id(bt_speaker).is_connected();

sensor:
  - platform: template
    name: Free internal RAM
    entity_category: diagnostic
    unit_of_measurement: B
    update_interval: 30s
    lambda: return heap_caps_get_free_size(MALLOC_CAP_INTERNAL);
  # WiFi and Bluetooth share one radio: a weak signal means more retransmissions and less airtime for both
  - platform: wifi_signal
    name: WiFi signal
    entity_category: diagnostic
    update_interval: 30s

# Web interface: http://sendspin-bt-1.local (status, track info, controls, pairing)
web_server:
  port: 80
  version: 3
  # Reloads the page after "Search speakers", so the found speakers show up under "Speaker"
  js_include: web/pairing.js

text_sensor:
  # Tag on the NFC reader: the HA tag ID (tags written by the Companion app) or the UID, as sent to Home Assistant
  - platform: template
    id: nfc_tag
    name: NFC tag
    icon: mdi:nfc-variant
    update_interval: never
  - platform: template
    name: Bluetooth status
    icon: mdi:bluetooth
    update_interval: 2s
    lambda: return id(bt_speaker).get_status_text();
  # Track info from Music Assistant (enables Sendspin's metadata role)
  - platform: sendspin
    type: title
    name: Title
  - platform: sendspin
    type: artist
    name: Artist
  - platform: sendspin
    type: album
    name: Album

script:
  # Play/pause as a Sendspin command: media_player.toggle does nothing while no stream is active (e.g. after
  # Music Assistant stopped), while the server can always resume
  - id: play_pause
    then:
      - lambda: |-
          id(sendspin_hub).send_client_command(
              id(media_player_bt).state == media_player::MEDIA_PLAYER_STATE_PLAYING
                  ? sendspin::SendspinControllerCommand::PAUSE
                  : sendspin::SendspinControllerCommand::PLAY);
  # DEBUG streamed to an open web page takes enough WiFi airtime for audible Bluetooth dropouts: back to INFO
  - id: log_level_reset
    mode: restart
    then:
      - delay: 10min
      - select.set:
          id: log_level
          option: INFO

button:
  - platform: template
    name: Play Pause
    icon: mdi:play-pause
    on_press:
      - script.execute: play_pause
  - platform: template
    name: Next track
    icon: mdi:skip-next
    on_press:
      - lambda: id(sendspin_hub).send_client_command(sendspin::SendspinControllerCommand::NEXT);
  - platform: template
    name: Previous track
    icon: mdi:skip-previous
    on_press:
      - lambda: id(sendspin_hub).send_client_command(sendspin::SendspinControllerCommand::PREVIOUS);
  # Lists the speakers ready to pair under "Speaker" (the page reloads itself afterwards); disconnects the current
  # speaker for the ~13 s search
  - platform: template
    name: Search speakers
    icon: mdi:bluetooth-audio
    entity_category: config
    on_press:
      - lambda: id(bt_speaker).scan();
  # Disconnects and forgets the speaker; no connection attempts (also after a reboot) until a speaker is chosen
  - platform: template
    name: Unpair speaker
    icon: mdi:bluetooth-off
    entity_category: config
    on_press:
      - lambda: id(bt_speaker).unpair();
  # Drops the pairing and searches for the speaker by name: put the speaker into pairing mode first
  - platform: template
    name: Re-pair speaker
    icon: mdi:bluetooth-connect
    entity_category: config
    on_press:
      - lambda: id(bt_speaker).repair();

select:
  - platform: logger
    id: log_level
    name: Log level
    on_value:
      - if:
          condition:
            lambda: return x == "DEBUG" || x == "VERBOSE" || x == "VERY_VERBOSE";
          then:
            - script.execute: log_level_reset
          else:
            - script.stop: log_level_reset
  # Speakers found by "Search speakers"; choosing one drops the old pairing and pairs it
  - platform: a2dp_source
    name: Speaker

number:
  - platform: template
    name: Volume
    icon: mdi:volume-high
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    mode: slider
    update_interval: 1s
    lambda: return std::round(id(media_player_bt).volume * 100.0f);
    set_action:
      - media_player.volume_set:
          id: media_player_bt
          volume: !lambda return x / 100.0f;
