# Proof of Concept: Sendspin -> ESP32-WROVER -> Bluetooth (A2DP) -> Sony SRS-XB100
#
# Erstes Pairing: Box in den Pairing-Modus versetzen (Power/Pairing-Taste gedrückt halten),
# dann den ESP starten. Danach verbindet er sich automatisch neu.

substitutions:
  name: sendspin-bt-1
  friendly_name: Sendspin BT 1
  # Gefundene MAC aus dem Log hier eintragen und "address" unten aktivieren, dann entfällt die Suche
  bt_device_name: "SRS-XB100"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp-wrover-kit
  variant: esp32
  framework:
    type: esp-idf
    # WLAN-Kompromiss aus den A/B-Tests der nativen Variante (siehe docs/TESTPROTOKOLL.md):
    # Empfangs-Aggregation in kurzen Blöcken + kleine Puffer. Ohne Aggregation bzw. mit der lwIP-Standard-Mailbox (6)
    # staut sich der TCP-Strom und Sendspins Zeitsynchronisierung bricht (nur Stille); mit Sendspins
    # High-Performance-Vorgaben (BA 32, 16/64, 64 KB) stören lange WLAN-Bursts A2DP (Aussetzer).
    sdkconfig_options:
      CONFIG_ESP_WIFI_AMPDU_TX_ENABLED: n
      CONFIG_ESP_WIFI_AMPDU_RX_ENABLED: y
      CONFIG_ESP_WIFI_RX_BA_WIN: "6"
      CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM: "12"
      CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM: "40"
      CONFIG_LWIP_TCP_WND_DEFAULT: "32768"
      CONFIG_LWIP_TCP_SND_BUF_DEFAULT: "8192"
      CONFIG_LWIP_TCP_RECVMBOX_SIZE: "64"
      CONFIG_LWIP_TCPIP_RECVMBOX_SIZE: "64"
      # Core 0 für WLAN + Bluetooth freihalten (wie squeezelite-esp32): ESPHome-Hauptschleife und
      # Sendspin-Threads (Empfang, FLAC-Decoder) auf Core 1
      CONFIG_ESP_MAIN_TASK_AFFINITY_CPU0: n
      CONFIG_ESP_MAIN_TASK_AFFINITY_CPU1: y
      CONFIG_PTHREAD_DEFAULT_CORE_NO_AFFINITY: n
      CONFIG_PTHREAD_DEFAULT_CORE_1: y
      # TCP/IP-Stack ebenfalls auf Core 1 (Netzwerkverkehr nicht auf dem Funk-Core)
      CONFIG_LWIP_TCPIP_TASK_AFFINITY_NO_AFFINITY: n
      CONFIG_LWIP_TCPIP_TASK_AFFINITY_CPU1: y
      # Diagnose: CPU-Last pro Task in der Log-Zeile "Load:"
      CONFIG_FREERTOS_USE_TRACE_FACILITY: y
      CONFIG_FREERTOS_GENERATE_RUN_TIME_STATS: y
      CONFIG_FREERTOS_VTASKLIST_INCLUDE_COREID: y

psram:
  mode: quad
  speed: 40MHz

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Modem-Sleep außerhalb des Streamings; während des Streamings schaltet Sendspin ihn für eine genaue
  # Zeitsynchronisierung ab ("High Performance")
  power_save_mode: light

external_components:
  - source:
      type: local
      path: components
    components: [a2dp_source]

speaker:
  - platform: a2dp_source
    id: bt_speaker
    device_name: ${bt_device_name}
    # address: "AA:BB:CC:DD:EE:FF"
    local_name: ${friendly_name}
    # liegt im internen RAM (schneller Zugriff aus dem Bluetooth-Task), daher knapp halten
    buffer_duration: 200ms
    reconnect_interval: 15s

sendspin:
  # Kein Task-Stack im PSRAM: auf ESP32 rev1 führt das zu Abstürzen im Sendspin-Puffer
  task_stack_in_psram: false

media_source:
  - platform: sendspin
    id: sendspin_source
    # A2DP (SBC) arbeitet fest mit 44,1 kHz -> kein Opus (nur 48 kHz), kein Resampling nötig
    sample_rate: 44100
    codecs: [flac, pcm]
    # klein halten: je mehr Puffer, desto größere WLAN-Bursts beim Vorausschicken, die A2DP stören
    buffer_size: 150000
    # Interner RAM: PSRAM des ESP32 rev1 ist (Cache-Workaround) langsam
    decode_memory: internal
    # Bluetooth-Latenz der Box ausgleichen (XB100 meldet selbst 250 ms); in Music Assistant nachjustierbar
    initial_static_delay: 250ms
    static_delay_adjustable: true

media_player:
  - platform: speaker_source
    id: media_player_bt
    name: Player
    media_pipeline:
      speaker: bt_speaker
      sources:
        - sendspin_source

binary_sensor:
  - platform: template
    name: Bluetooth verbunden
    entity_category: diagnostic
    lambda: return id(bt_speaker).is_connected();

sensor:
  - platform: template
    name: Freier interner RAM
    entity_category: diagnostic
    unit_of_measurement: B
    update_interval: 30s
    lambda: return heap_caps_get_free_size(MALLOC_CAP_INTERNAL);
